name: 每日自动签到

on:
  schedule:
    # GitHub Actions cron 使用 UTC 时间，北京时间 = UTC+8
    # 主签到：北京时间 08:00 = UTC 00:00
    - cron: '0 0 * * *'
    # 兜底：北京时间 10:00 = UTC 02:00（第一次失败时补签）
    - cron: '0 2 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行签到脚本
        env:
          TRAE_TOKEN: ${{ secrets.TRAE_TOKEN }}
          CODEBUDDY_TOKEN: ${{ secrets.CODEBUDDY_TOKEN }}
          SC_KEY: ${{ secrets.SC_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python checkin.py
